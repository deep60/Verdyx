[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "verdyx"
version = "0.1.0"
description = "Verdyx malware and URL scanning: Python SDK"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = []
keywords = ["malware", "scanner", "security", "threat-intelligence", "yara"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Security",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://verdyx.dev"
Source = "https://github.com/deep60/Verdyx/tree/main/sdk/python"

[tool.setuptools]
packages = ["verdyx"]

[tool.setuptools.package-data]
verdyx = ["py.typed"]
