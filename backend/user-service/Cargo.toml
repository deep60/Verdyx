[package]
name = "user-service"
version = "0.1.0"
edition = "2021"
authors = ["Verdyx Team"]
description = "User service for Verdyx - handles authentication, profiles, and KYC"
license = "MIT"
repository = "https://github.com/verdyx/deep60"

[dependencies]
# Web framework
axum = { version = "0.8", features = ["macros", "multipart"] }
tower = "0.4"
tower-http = { version = "0.6", features = ["cors", "trace", "limit", "catch-panic"] }

# Async runtime
tokio = { version = "1.0", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Database
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "chrono", "uuid"] }

# Redis for sessions
redis = { version = "0.24", features = ["tokio-comp", "connection-manager"] }

# UUID support
uuid = { version = "1.0", features = ["serde", "v4"] }

# Date and time
chrono = { version = "0.4", features = ["serde"] }

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Logging and tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Configuration
config = "0.15"
dotenvy = "0.15"

# Authentication
jsonwebtoken = { version = "10.3", features = ["aws_lc_rs"] }
argon2 = "0.5"
bcrypt = "0.19"

# Validation
validator = { version = "0.18", features = ["derive"] }
email_address = "0.2"

# 2FA support
totp-lite = "2.0"
base32 = "0.5"
rand = "0.10"

# Ethereum/Web3
ethers = { version = "2.0", features = ["abigen"] }

# Transactional email (password reset links)
lettre = { version = "0.11", default-features = false, features = ["tokio1-rustls-tls", "smtp-transport", "builder", "hostname"] }

# HTTP client
reqwest = { version = "0.12", features = ["json"] }

# Storage (S3/MinIO) for avatar uploads
aws-sdk-s3 = { version = "1.0", default-features = false, features = ["default-https-client", "rt-tokio", "sigv4a"] }
aws-config = { version = "1.0", default-features = false, features = ["default-https-client", "rt-tokio"] }

# Async trait support
async-trait = "0.1"

shared = { path = "../shared", features = ["axum-mw", "redis"] }

[dev-dependencies]
tokio-test = "0.4"

[[bin]]
name = "user-service"
path = "src/main.rs"
