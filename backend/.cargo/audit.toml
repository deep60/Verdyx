# cargo-audit configuration.
#
# The advisories below are ACKNOWLEDGED AND DEFERRED, not hidden: each requires
# a breaking major-version dependency migration that must be done and compile-
# tested on its own. They are ignored so the audit gate stays green and can flag
# NEW advisories. Track these for a follow-up dependency-upgrade pass and remove
# entries here as they are resolved.
#
# Everything else is kept up to date via `cargo update` (this pass already fixed
# 14 advisories, including the 9.1-critical lettre RUSTSEC-2026-0141 and the
# aws-lc-sys highs).

[advisories]
ignore = [
    # RSA Marvin timing side-channel — no fixed upgrade exists (transitive).
    "RUSTSEC-2023-0071",

    # sqlx binary-protocol cast issue — fix is sqlx 0.8, a breaking bump from the
    # 0.7 pinned across all services (query macros / API changes). Needs migration.
    "RUSTSEC-2024-0363",

    # idna <1.0 punycode issue — pulled transitively via an old `url`; requires
    # parent major bumps to reach idna 1.0.
    "RUSTSEC-2024-0421",

    # Old rustls 0.21 stack (ring 0.16, rustls-webpki 0.101, h2 0.3, webpki-roots
    # 0.25). Our own code is on reqwest 0.12; only ethers 2.0.14, the final release
    # of a deprecated crate, still pulls this in, through reqwest 0.11 and
    # tungstenite 0.20. It is built into api-gateway, bounty-manager,
    # payment-service and user-service and used for their blockchain RPC calls.
    # Resolved by migrating from ethers to alloy.
    "RUSTSEC-2025-0009",
    "RUSTSEC-2026-0098",
    "RUSTSEC-2026-0099",
    "RUSTSEC-2026-0104",
    "RUSTSEC-2026-0258",
    "RUSTSEC-2026-0346",
    "RUSTSEC-2026-0349",
    "RUSTSEC-2026-0381",
    "RUSTSEC-2026-0382",

    # crypto-bigint 0.5 timing issues, pulled by ethers through k256 and
    # elliptic-curve 0.13. Resolved by the same alloy migration, if its k256 has
    # moved to crypto-bigint 0.7 by then.
    "RUSTSEC-2026-0387",

    # zip 0.6 and zstd-safe 5 are in Cargo.lock only, through the optional svm-rs
    # dependency of ethers-solc. `cargo tree --all-features --target all` shows no
    # service builds them. The archive scanner uses zip 9, which is patched.
    "RUSTSEC-2026-0367",
    "RUSTSEC-2026-0368",
    "RUSTSEC-2026-0369",
    "RUSTSEC-2026-0403",
]
