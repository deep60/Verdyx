[package]
name = "consensus-service"
version = "0.1.0"
edition = "2021"
authors = ["Verdyx Team"]
description = "Consensus service for Verdyx - aggregates analysis results using weighted voting"
license = "MIT"
repository = "https://github.com/verdyx/deep60"

[dependencies]
# Web framework
axum = { version = "0.8", features = ["macros"] }
tower = "0.4"
tower-http = { version = "0.6", features = ["cors", "trace", "limit", "catch-panic"] }

# Async runtime
tokio = { version = "1.0", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Database
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "chrono", "uuid", "rust_decimal"] }

# Redis for caching
redis = { version = "0.24", features = ["tokio-comp", "connection-manager"] }

# Decimal arithmetic
rust_decimal = { version = "1.33", features = ["serde-with-str"] }

# UUID support
uuid = { version = "1.0", features = ["serde", "v4"] }

# Date and time
chrono = { version = "0.4", features = ["serde"] }

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Logging and tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Configuration
config = "0.15"
dotenvy = "0.15"

# Async trait support
async-trait = "0.1"

# Validation
validator = { version = "0.18", features = ["derive"] }

# Statistical calculations
statrs = "0.16"

# HTTP client - used by the regrader worker to re-scan samples via analysis-engine
reqwest = { version = "0.11", features = ["json"] }

# Commit-reveal voting. Pinned to the 0.10 line to stay on the workspace's
# shared `digest` 0.10 -- see the backend MSRV/hashing notes.
sha2 = "0.10"
hex = "0.4"

# Shared module
shared = { path = "../shared", features = ["axum-mw", "otel", "validation", "idempotency", "circuit-breaker"] }

[dev-dependencies]
tokio-test = "0.4"

[[bin]]
name = "consensus-service"
path = "src/main.rs"
