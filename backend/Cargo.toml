[workspace]
members = [
    "api-gateway",
    "analysis-engine",
    "bounty-manager",
    "notification-service",
    "user-service",
    "submission-service",
    "reputation-service",
    "consensus-service",
    "payment-service",
    "shared",
    "proptest",
]
resolver = "2"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.35", features = ["full"] }
futures = "0.3"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bytes = "1.5"

# Database
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "chrono", "uuid"] }
redis = { version = "0.24", features = ["aio", "tokio-comp"] }

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Logging
tracing = "0.1"
# `json` enables JSON-formatted log output; we standardize on JSON so logs
# aggregate cleanly across the fleet (Loki/CloudWatch/etc).
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Crypto dependencies
base64 = "0.22"
rand = "0.8"
hex = "0.4"

# OpenTelemetry (pinned to avoid version conflicts)
# tracing-opentelemetry 0.28+ supports opentelemetry 0.27+
opentelemetry = "0.27"
opentelemetry_sdk = "0.27"
opentelemetry-otlp = { version = "0.27", features = ["grpc-tonic"] }
opentelemetry-http = "0.27"
tracing-opentelemetry = "0.28"
opentelemetry-semantic-conventions = "0.27"

# Configuration
config = "0.15"
dotenvy = "0.15"

# HTTP client
reqwest = { version = "0.11", features = ["json"] }

# Blockchain integration
ethers = "2.0"

# UUID generation
uuid = { version = "1.6", features = ["v4", "serde"] }

# Validation
validator = { version = "0.18", features = ["derive"] }

# Testing
tokio-test = "0.4"
mockall = "0.12"
pretty_assertions = "1.4"
proptest = "1.0"

[profile.test]
opt-level = 3
debug = true

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
# Unwind (not abort) so a panicking request handler can be caught by
# tower-http's CatchPanicLayer and turned into a 500 response instead of
# taking down the entire service process. Graceful degradation > hard crash.
panic = "unwind"

[profile.dev]
opt-level = 0
debug = true
