# Cargo Deny Configuration for Verdyx Backend
# https://github.com/EmbarkStudios/cargo-deny

[advisories]
# Vulnerability database to use (default: rustsec)
# db = "rustsec"
# Path to local advisory database (optional)
# db-path = "path/to/db"
# Severity threshold for vulnerabilities (default: all)
# severity = "all"
# Ignore specific vulnerability IDs (e.g., false positives)
ignore = []

[licenses]
# License compliance
# Allow these SPDX license expressions
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSD-4-Clause",
    "ISC",
    "MPL-2.0",
    "MPL-1.1",
    "MPL-1.0",
    "Unicode-DFS-2016",
    "Zlib",
    "CC0-1.0",
]
# Deny these licenses
deny = [
    "GPL-3.0-only",
    "GPL-3.0-or-later",
    "AGPL-3.0-only",
    "AGPL-3.0-or-later",
    "LGPL-3.0-only",
    "LGPL-3.0-or-later",
    "SSPL-1.0",
    "Elastic-2.0",
    "BSL-1.0",
    "Commons-Clause-1.0",
]
# Allow specific crates to have disallowed licenses (with justification)
# allow-clarifications = { "some-crate" = "Internal use only, reviewed" }
# Unlicensed crates: "allow", "deny", "warn" (default: deny)
unlicensed = "deny"

[bans]
# Crates to ban (multiple versions = multiple entries)
# Multiple criteria can be specified per entry
# deny = [
#   { name = "openssl", version = "=0.10.0" },
#   { name = "some-bad-crate" },
# ]
# Allow specific versions of banned crates
# allow = [
#   { name = "openssl", version = ">=0.10.1" },
# ]
# Skip certain crates from bans (e.g., transitive dependencies you can't control)
# skip = [
#   { name = "openssl" },
# ]
# Multiple versions of the same crate: "allow", "deny", "warn" (default: warn)
multiple-versions = "warn"
# Highlight crates with yanked versions: "allow", "deny", "warn" (default: warn)
yanked = "warn"

[sources]
# Trusted crate sources (default: crates.io)
# allow-unknown = false
# allow-git = false
# Use alternative registries
# allow = [
#   { registry = "crates.io" },
# ]

[advisories]
# Ignore specific advisories
# ignore = ["RUSTSEC-2020-0071"]