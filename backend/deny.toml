# Cargo Deny Configuration for Verdyx Backend
# https://github.com/EmbarkStudios/cargo-deny

[advisories]
yanked = "warn"
# Fail on unmaintained crates we depend on directly, not transitive ones.
unmaintained = "workspace"
# The deferred advisories from .cargo/audit.toml, where each one's reason is
# recorded, limited to crates that are actually built. cargo-deny follows the real
# build graph, so the Cargo.lock-only entries there aren't needed here.
ignore = [
    "RUSTSEC-2024-0421",
    "RUSTSEC-2025-0009",
    "RUSTSEC-2026-0098",
    "RUSTSEC-2026-0099",
    "RUSTSEC-2026-0104",
    "RUSTSEC-2026-0258",
    "RUSTSEC-2026-0346",
    "RUSTSEC-2026-0349",
    "RUSTSEC-2026-0381",
    "RUSTSEC-2026-0382",
    "RUSTSEC-2026-0387",
]

[licenses]
# Anything not listed here is rejected.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSD-4-Clause",
    "ISC",
    "MPL-2.0",
    "MPL-1.1",
    "MPL-1.0",
    "Unicode-DFS-2016",
    "Zlib",
    "CC0-1.0",
    "0BSD",
    "bzip2-1.0.6",
    "CDLA-Permissive-2.0",
    "OpenSSL",
    "Unicode-3.0",
    "Unlicense",
]

[licenses.private]
ignore = true

# ring 0.16 has no license field in its manifest.
[[licenses.clarify]]
name = "ring"
version = "0.16.20"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
