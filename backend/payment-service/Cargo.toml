[package]
name = "payment-service"
version = "0.1.0"
edition = "2021"
authors = ["Verdyx Team"]
description = "Payment service for Verdyx - handles bounty rewards, stakes, and blockchain transactions"
license = "MIT"
repository = "https://github.com/verdyx/deep60"

[dependencies]
# Web framework
axum = { version = "0.8", features = ["macros"] }
tower = "0.4"
tower-http = { version = "0.6", features = ["cors", "trace", "limit", "catch-panic"] }

# Async runtime
tokio = { version = "1.0", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Database
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "chrono", "uuid", "rust_decimal"] }

# Redis for caching and locks
redis = { version = "0.24", features = ["tokio-comp", "connection-manager"] }

# Blockchain/Ethereum
ethers = { version = "2.0", features = ["ws", "rustls", "abigen"] }

# Decimal arithmetic for precise token amounts
rust_decimal = { version = "1.33", features = ["serde-with-str"] }

# UUID support
uuid = { version = "1.0", features = ["serde", "v4"] }

# Date and time
chrono = { version = "0.4", features = ["serde"] }

# HTTP client
reqwest = { version = "0.11", features = ["json", "rustls-tls"] }

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Logging and tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Configuration
config = "0.15"
dotenvy = "0.15"

# Async trait support
async-trait = "0.1"

# Validation
validator = { version = "0.18", features = ["derive"] }

# Hex encoding/decoding
hex = "0.4"

# Background job processing
tokio-cron-scheduler = "0.15"

# Shared module
shared = { path = "../shared", features = ["axum-mw"] }

[dev-dependencies]
tokio-test = "0.4"
mockito = "1.2"

[[bin]]
name = "payment-service"
path = "src/main.rs"
