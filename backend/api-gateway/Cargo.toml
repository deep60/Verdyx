[package]
name = "api-gateway"
version = "0.1.0"
edition = "2021"
authors = ["Verdyx Team"]
description = "API Gateway for Verdyx decentralized threat intelligence platform"
license = "MIT"
repository = "https://github.com/verdyx/deep60"


[dependencies]
# Web framework
axum = { version = "0.8", features = ["multipart", "ws"] }
tower-http = { version = "0.6", features = ["cors", "trace", "limit", "catch-panic"] }

# Async runtime
tokio = { version = "1.0", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Database
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "chrono", "uuid"] }

# Redis
redis = { version = "0.24", features = ["tokio-comp", "connection-manager"] }

# Blockchain/Ethereum
ethers = { version = "2.0", features = ["ws", "rustls"] }

# Cryptography and hashing
sha2 = "0.10"
md5 = "0.7"
sha1 = "0.10"

# UUID support
uuid = { version = "1.0", features = ["serde", "v4"] }

# Date and time
chrono = { version = "0.4", features = ["serde"] }

# HTTP client
reqwest = { version = "0.11", features = ["json", "multipart"] }

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Environment variables
dotenvy = "0.15"

# JWT tokens
jsonwebtoken = "9.3"

# Password hashing
argon2 = "0.5"

# Configuration
config = "0.15"
toml = "0.8"

# File handling
tempfile = "3.0"
mime = "0.3"

# Rate limiting
governor = "0.6"

# Validation
validator = { version = "0.18", features = ["derive"] }

# Additional utilities that might be needed based on your code
base64 = "0.22"
hex = "0.4"
bcrypt = "0.19.2"
regex = "1.11.2"
sha3 = "0.10"
ring = "0.17.14"
url = "2.5.7"
urlencoding = "2.1.3"
rmp-serde = "1.1"
serde_urlencoded = "0.7"
flate2 = "1.0"
tower = "0.4"
async-trait = "0.1"
tokio-tungstenite = "0.24"
futures-util = "0.3"

# Shared metrics/utilities used by every service so the gateway emits the
# same Prometheus `verdyx_*` schema as the rest of the fleet.
shared = { path = "../shared", features = ["axum-mw"] }

[dev-dependencies]
# Testing utilities
tokio-test = "0.4"

[[bin]]
name = "api-gateway"
path = "src/main.rs"
