<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#C8C5BC" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/verdyx-logo.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Host+Grotesk:ital,wght@0,400;0,500;0,600&family=Newsreader:ital,opsz,wght@1,16..72,400;1,16..72,500&display=swap" rel="stylesheet">
    <script defer data-domain="verdyx.com" src="https://plausible.io/js/script.js"></script>
    <script>
      (function () {
        try {
          var path = window.location.pathname;
          var housing = /^\/(dashboard|marketplace|profile|analysis)(\/|$)/.test(path);
          document.documentElement.dataset.plate = housing ? "housing" : "bench";
          document.documentElement.classList.toggle("dark", housing);
          document.documentElement.style.colorScheme = housing ? "dark" : "light";
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", housing ? "#141513" : "#C8C5BC");
        } catch (e) {
          document.documentElement.dataset.plate = "bench";
          document.documentElement.classList.remove("dark");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
