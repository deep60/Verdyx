<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#C8C5BC" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/verdyx-logo.png" />

    <!--
      Defaults for crawlers and link previews that do not run JavaScript.
      Tags marked data-seo-default are removed by <SEO> once the app renders,
      so each page's own title and description take over.
    -->
    <title data-seo-default>Verdyx — Malware verdicts you can audit</title>
    <meta data-seo-default name="description" content="Verdyx runs several malware engines on one file and shows every vote, its confidence, and the evidence. URL scans cover DNS, TLS, mail auth, and the page." />
    <link data-seo-default rel="canonical" href="https://verdyx.dev/" />
    <meta property="og:site_name" content="Verdyx" />
    <meta data-seo-default property="og:type" content="website" />
    <meta data-seo-default property="og:url" content="https://verdyx.dev/" />
    <meta data-seo-default property="og:title" content="Verdyx — Malware verdicts you can audit" />
    <meta data-seo-default property="og:description" content="Several malware engines on one file, with every vote, its confidence, and the evidence." />
    <meta data-seo-default property="og:image" content="https://verdyx.dev/og-image.png" />
    <meta data-seo-default property="og:image:width" content="1200" />
    <meta data-seo-default property="og:image:height" content="630" />
    <meta data-seo-default name="twitter:card" content="summary_large_image" />
    <meta data-seo-default name="twitter:title" content="Verdyx — Malware verdicts you can audit" />
    <meta data-seo-default name="twitter:description" content="Several malware engines on one file, with every vote, its confidence, and the evidence." />
    <meta data-seo-default name="twitter:image" content="https://verdyx.dev/og-image.png" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://verdyx.dev/#organization",
            "name": "Verdyx",
            "url": "https://verdyx.dev/",
            "logo": "https://verdyx.dev/verdyx-logo.png",
            "description": "Multi-engine malware and URL analysis with auditable verdicts."
          },
          {
            "@type": "WebSite",
            "@id": "https://verdyx.dev/#website",
            "name": "Verdyx",
            "alternateName": "verdyx.dev",
            "url": "https://verdyx.dev/",
            "publisher": { "@id": "https://verdyx.dev/#organization" }
          },
          {
            "@type": "SoftwareApplication",
            "name": "Verdyx",
            "url": "https://verdyx.dev/",
            "applicationCategory": "SecurityApplication",
            "operatingSystem": "Web",
            "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
            "publisher": { "@id": "https://verdyx.dev/#organization" }
          }
        ]
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Host+Grotesk:ital,wght@0,400;0,500;0,600&family=Newsreader:ital,opsz,wght@1,16..72,400;1,16..72,500&display=swap" rel="stylesheet">
    <script>
      (function () {
        try {
          var path = window.location.pathname;
          var housing = /^\/(dashboard|marketplace|profile|analysis)(\/|$)/.test(path);
          document.documentElement.dataset.plate = housing ? "housing" : "bench";
          document.documentElement.classList.toggle("dark", housing);
          document.documentElement.style.colorScheme = housing ? "dark" : "light";
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", housing ? "#141513" : "#C8C5BC");
        } catch (e) {
          document.documentElement.dataset.plate = "bench";
          document.documentElement.classList.remove("dark");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
