; Production host: Oracle Cloud instance "verdyx" (ap-hyderabad-1, AD-1),
; shape VM.Standard.E2.1.Micro. This is what verdyx.duckdns.org resolves to.
; The previous entry (52.90.127.105, an AWS box) is dead -- it accepts no
; connections -- and following it silently pointed deploys at nothing.
[verdyx_app]
verdyx-prod-1 ansible_host=68.233.97.210 ansible_user=ubuntu

[verdyx:children]
verdyx_app

[verdyx:vars]
ansible_ssh_private_key_file=~/.ssh/verdyx-prod.pem
verdyx_repo_url=https://github.com/deep60/Verdyx.git
verdyx_repo_branch=main
verdyx_install_path=/opt/verdyx
verdyx_user=verdyx
verdyx_compose_file=docker-compose.yml
verdyx_domain=verdyx.duckdns.org
