# ⚠️ DEPRECATED — NOT the deploy target. See infrastructure/DEPLOYMENT.md.
#
# CI (.github/workflows/deploy.yml) deploys the ROOT ../../../docker-compose.yml
# on the VM, NOT this file. This compose is stale and contradictory:
#   - it points every service at a single `verdyx` database, but the services
#     use per-service databases (verdyx_gateway, verdyx_users, ...);
#   - it self-hosts Postgres/Redis, but production uses managed RDS/ElastiCache;
#   - the frontend uses dead REACT_APP_* vars (the app is Vite, not CRA) and
#     the old api.verdyx.com domain (now verdyx.io).
# Kept only for reference until the Phase-2 Kubernetes path lands. Do not run it.
version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    build:
      context: ../../..
      dockerfile: infrastructure/docker/postgres.Dockerfile
    container_name: verdyx-postgres-prod
    environment:
      POSTGRES_DB: verdyx
      POSTGRES_USER: verdyx
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../../../database/migrations:/docker-entrypoint-initdb.d/migrations
      - ../../../database/seeds:/docker-entrypoint-initdb.d/seeds
    networks:
      - verdyx-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U verdyx -d verdyx"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '0.5'
          memory: 1G

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: verdyx-redis-prod
    volumes:
      - redis_data:/data
    networks:
      - verdyx-network
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 2G
        reservations:
          cpus: '0.25'
          memory: 512M

  # API Gateway
  api-gateway:
    build:
      context: ../../..
      dockerfile: infrastructure/docker/production/api-gateway/api-gateway.Dockerfile
    container_name: verdyx-api-gateway-prod
    environment:
      DATABASE_URL: postgresql://verdyx:${POSTGRES_PASSWORD}@postgres:5432/verdyx
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      JWT_SECRET: ${JWT_SECRET}
      BLOCKCHAIN_RPC_URL: ${BLOCKCHAIN_RPC_URL}
      # Downstream service URLs. analysis-engine and bounty-manager keep their
      # historical prod internal ports; the remaining services listen on 8080.
      ANALYSIS_ENGINE_URL: http://analysis-engine:8082
      BOUNTY_MANAGER_URL: http://bounty-manager:8083
      USER_SERVICE_URL: http://user-service:8080
      SUBMISSION_SERVICE_URL: http://submission-service:8080
      STORAGE_SERVICE_URL: http://submission-service:8080
      CONSENSUS_SERVICE_URL: http://consensus-service:8080
      PAYMENT_SERVICE_URL: http://payment-service:8080
      REPUTATION_SERVICE_URL: http://reputation-service:8080
      NOTIFICATION_SERVICE_URL: http://notification-service:8080
      RUST_LOG: info
      PORT: 8080
      ENVIRONMENT: production
    ports:
      - "8080:8080"
    volumes:
      - ./uploads:/app/uploads
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - verdyx-network
    restart: unless-stopped
    deploy:
      replicas: 3
      resources:
        limits:
          cpus: '1'
          memory: 2G
        reservations:
          cpus: '0.25'
          memory: 512M

  # Analysis Engine
  analysis-engine:
    build:
      context: ../../..
      dockerfile: infrastructure/docker/production/analysis-engine/analysis-engine.Dockerfile
    container_name: verdyx-analysis-engine-prod
    environment:
      DATABASE_URL: postgresql://verdyx:${POSTGRES_PASSWORD}@postgres:5432/verdyx
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      RUST_LOG: info
      SERVER_PORT: 8082
      YARA_RULES_PATH: /app/rules
      UPLOAD_DIR: /app/uploads
      MAX_FILE_SIZE: ${MAX_FILE_SIZE:-104857600}
    ports:
      - "8082:8082"
    volumes:
      - ./uploads:/app/uploads
      - ../../../backend/analysis-engine/rules:/app/rules
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - verdyx-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '0.5'
          memory: 1G

  # Bounty Manager
  bounty-manager:
    build:
      context: ../../..
      dockerfile: infrastructure/docker/production/bounty-manager/bounty-manager.Dockerfile
    container_name: verdyx-bounty-manager-prod
    environment:
      DATABASE_URL: postgresql://verdyx:${POSTGRES_PASSWORD}@postgres:5432/verdyx
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      BLOCKCHAIN_RPC_URL: ${BLOCKCHAIN_RPC_URL}
      RUST_LOG: info
      PORT: 8083
      ENVIRONMENT: production
    ports:
      - "8083:8083"
    volumes:
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - verdyx-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 2G
        reservations:
          cpus: '0.25'
          memory: 512M

  # MinIO (S3-compatible object storage). Required by submission-service, which
  # calls ensure_bucket_exists() at startup and will not boot without a
  # reachable S3 endpoint.
  minio:
    image: pgsty/silo:RELEASE.2026-09-16T00-00-00Z
    container_name: verdyx-minio-prod
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-verdyx_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    networks:
      - verdyx-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 2G
        reservations:
          cpus: '0.25'
          memory: 512M

  # User Service
  user-service:
    build:
      context: ../../../backend
      dockerfile: user-service/Dockerfile
    container_name: verdyx-user-service-prod
    environment:
      DATABASE_URL: postgresql://verdyx:${POSTGRES_PASSWORD}@postgres:5432/verdyx
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      JWT_SECRET: ${JWT_SECRET}
      BLOCKCHAIN_RPC_URL: ${BLOCKCHAIN_RPC_URL}
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 8080
      RUST_LOG: info
      ENVIRONMENT: production
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - verdyx-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 2G
        reservations:
          cpus: '0.25'
          memory: 512M

  # Submission Service
  submission-service:
    build:
      context: ../../../backend
      dockerfile: submission-service/Dockerfile
    container_name: verdyx-submission-service-prod
    environment:
      DATABASE_URL: postgresql://verdyx:${POSTGRES_PASSWORD}@postgres:5432/verdyx
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 8080
      SUBMISSION_SERVICE_PORT: 8080
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: verdyx-submissions
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-verdyx_admin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      RUST_LOG: info
      ENVIRONMENT: production
    ports:
      - "8084:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - verdyx-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 2G
        reservations:
          cpus: '0.25'
          memory: 512M

  # Consensus Service
  consensus-service:
    build:
      context: ../../../backend
      dockerfile: consensus-service/Dockerfile
    container_name: verdyx-consensus-service-prod
    environment:
      DATABASE_URL: postgresql://verdyx:${POSTGRES_PASSWORD}@postgres:5432/verdyx
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 8080
      CONSENSUS_THRESHOLD: "0.7"
      MIN_SUBMISSIONS_REQUIRED: "3"
      RUST_LOG: info
      ENVIRONMENT: production
    ports:
      - "8085:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - verdyx-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 2G
        reservations:
          cpus: '0.25'
          memory: 512M

  # Payment Service
  payment-service:
    build:
      context: ../../../backend
      dockerfile: payment-service/Dockerfile
    container_name: verdyx-payment-service-prod
    environment:
      DATABASE_URL: postgresql://verdyx:${POSTGRES_PASSWORD}@postgres:5432/verdyx
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 8080
      BLOCKCHAIN_RPC_URL: ${BLOCKCHAIN_RPC_URL}
      BLOCKCHAIN_CHAIN_ID: ${CHAIN_ID:-31337}
      TREASURY_ADDRESS: ${TREASURY_ADDRESS}
      TREASURY_PRIVATE_KEY: ${TREASURY_PRIVATE_KEY}
      TOKEN_CONTRACT_ADDRESS: ${THREAT_TOKEN_ADDRESS}
      PAYMENT_CONTRACT_ADDRESS: ${BOUNTY_MANAGER_ADDRESS}
      RUST_LOG: info
      ENVIRONMENT: production
    ports:
      - "8086:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - verdyx-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 2G
        reservations:
          cpus: '0.25'
          memory: 512M

  # Reputation Service
  reputation-service:
    build:
      context: ../../../backend
      dockerfile: reputation-service/Dockerfile
    container_name: verdyx-reputation-service-prod
    environment:
      DATABASE_URL: postgresql://verdyx:${POSTGRES_PASSWORD}@postgres:5432/verdyx
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 8080
      REPUTATION_DECAY_RATE: "0.95"
      REPUTATION_UPDATE_INTERVAL: "3600"
      RUST_LOG: info
      ENVIRONMENT: production
    ports:
      - "8087:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - verdyx-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 2G
        reservations:
          cpus: '0.25'
          memory: 512M

  # Notification Service
  notification-service:
    build:
      context: ../../../backend
      dockerfile: notification-service/Dockerfile
    container_name: verdyx-notification-service-prod
    environment:
      DATABASE_URL: postgresql://verdyx:${POSTGRES_PASSWORD}@postgres:5432/verdyx
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 8080
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      EMAIL_FROM: ${EMAIL_FROM}
      WEBHOOK_TIMEOUT: "30"
      MAX_RETRY_ATTEMPTS: "3"
      RUST_LOG: info
      ENVIRONMENT: production
    ports:
      - "8088:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - verdyx-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 2G
        reservations:
          cpus: '0.25'
          memory: 512M

  # Frontend
  frontend:
    build:
      context: ../../..
      dockerfile: infrastructure/docker/production/frontend/frontend.Dockerfile
    container_name: verdyx-frontend-prod
    environment:
      REACT_APP_API_URL: ${API_URL:-https://api.verdyx.com}
      REACT_APP_WS_URL: ${WS_URL:-wss://api.verdyx.com}
      REACT_APP_BLOCKCHAIN_NETWORK: ${BLOCKCHAIN_NETWORK:-mainnet}
    ports:
      - "3000:3000"
    depends_on:
      - api-gateway
    networks:
      - verdyx-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M

  # IPFS Node (for storing analysis reports)
  ipfs:
    image: ipfs/kubo:latest
    container_name: verdyx-ipfs-prod
    ports:
      - "4001:4001"
      - "5001:5001"
      - "8081:8080"
    volumes:
      - ipfs_data:/data/ipfs
    networks:
      - verdyx-network
    environment:
      IPFS_PROFILE: server
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 2G
        reservations:
          cpus: '0.25'
          memory: 512M

  # Monitoring
  prometheus:
    image: prom/prometheus:latest
    container_name: verdyx-prometheus-prod
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - verdyx-network
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 1G
        reservations:
          cpus: '0.1'
          memory: 256M

  grafana:
    image: grafana/grafana:latest
    container_name: verdyx-grafana-prod
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-https://monitoring.verdyx.com}
      GF_INSTALL_PLUGINS: grafana-piechart-panel
    networks:
      - verdyx-network
    depends_on:
      - prometheus
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local
  ipfs_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

networks:
  verdyx-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.25.0.0/16
