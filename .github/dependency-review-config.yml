# Dependency Review Configuration
# https://github.com/actions/dependency-review-action#configuration-options

# Fail the review if any vulnerability with severity HIGH or CRITICAL is found
fail-on-severity: high

# Allow specific GHSA IDs (GitHub Security Advisory IDs) that are false positives
# or have been assessed as acceptable risk
allow-ghsas: []

# Scope of the dependency review - which ecosystems to check
# Default: all ecosystems supported by the GitHub Advisory Database
# scope: [rust, npm, go, maven, nuget, pip, composer, pub, hex, cocoapods]

# Custom vulnerability database (optional)
# vulnerability-database-url: https://github.com/github/advisory-database

# Comment on PR with summary (default: true)
# comment-summary-in-pr: true

# Minimum severity to show in PR comment (default: low)
# comment-minimum-severity: low

# Fail on license violations (optional)
# license-policy-file: .github/license-policy.yml

# Custom labels for the PR (optional)
# labels: [dependencies, security]

# Allow specific licenses (optional)
# allowed-licenses: [MIT, Apache-2.0, BSD-3-Clause, BSD-2-Clause, ISC, MPL-2.0]

# Deny specific licenses (optional)
# denied-licenses: [GPL-3.0, AGPL-3.0, LGPL-3.0]