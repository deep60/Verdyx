name: Security Scan

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]
  schedule:
    # Daily at 02:00 UTC — catch new CVEs on unchanged code
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  packages: read

jobs:
  trivy-fs:
    name: Trivy Filesystem Scan (SAST + Secrets + IaC)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH,MEDIUM
          ignore-unfixed: true
          format: sarif
          output: trivy-fs-results.sarif
        continue-on-error: true

      - name: Upload Trivy FS results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-fs-results.sarif
          category: trivy-fs
        continue-on-error: true

  grype:
    name: Grype (Vulnerability Scanner)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Grype on filesystem
        uses: anchore/scan-action@v5
        with:
          path: "."
          fail-build: false
          severity-cutoff: high
          output-format: "sarif"
          output-file: "grype-results.sarif"

      - name: Upload Grype results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: grype-results.sarif
          category: grype
        continue-on-error: true

  git-secrets:
    name: Git Secrets (GitLeaks + TruffleHog)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run GitLeaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          config: .github/gitleaks.toml
        continue-on-error: true

      - name: Run TruffleHog
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: main
          head: HEAD
        continue-on-error: true

  cargo-audit:
    name: Cargo Audit (Rust Dependencies)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Run cargo audit
        run: cargo audit --deny warnings

      - name: Generate SARIF
        run: |
          cargo install cargo-audit-sarif
          cargo audit --json > cargo-audit.json
          cargo audit-sarif cargo-audit.json cargo-audit.sarif
        continue-on-error: true

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: ./backend/cargo-audit.sarif
          category: cargo-audit
        continue-on-error: true

  npm-audit:
    name: NPM Audit (Frontend Dependencies)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit (production only)
        run: npm audit --omit=dev --audit-level=high --json > npm-audit.json
        continue-on-error: true

      - name: Convert to SARIF
        if: always()
        run: |
          npx -y @microsoft/npm-audit-sarif npm-audit.json npm-audit.sarif
        continue-on-error: true

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: ./frontend/npm-audit.sarif
          category: npm-audit
        continue-on-error: true

  snyk:
    name: Snyk Security Scan
    runs-on: ubuntu-latest
    if: env.SNYK_TOKEN != ''
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Run Snyk on frontend
        uses: snyk/actions/node@master
        with:
          args: --severity-threshold=high --sarif-file-output=snyk-frontend.sarif
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        continue-on-error: true
        working-directory: ./frontend

      - name: Run Snyk on backend (via cargo)
        uses: snyk/actions/rust@master
        with:
          args: --severity-threshold=high --sarif-file-output=snyk-backend.sarif
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        continue-on-error: true
        working-directory: ./backend

      - name: Upload Snyk SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: snyk-*.sarif
          category: snyk
        continue-on-error: true

  license-check:
    name: License Compliance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check Rust licenses
        run: |
          cargo install cargo-license
          cd backend && cargo license --json > ../rust-licenses.json

      - name: Check npm licenses
        run: |
          cd frontend && npx license-checker --json > ../npm-licenses.json

      - name: Verify allowed licenses
        run: |
          # Define allowed licenses (MIT, Apache-2.0, BSD-3-Clause, BSD-2-Clause, ISC, MPL-2.0)
          ALLOWED="MIT Apache-2.0 BSD-3-Clause BSD-2-Clause ISC MPL-2.0"
          python3 <<'EOF'
          import json, sys
          allowed = set("MIT Apache-2.0 BSD-3-Clause BSD-2-Clause ISC MPL-2.0".split())
          violations = []
          for fname, label in [("rust-licenses.json", "Rust"), ("npm-licenses.json", "npm")]:
            try:
              with open(fname) as f:
                data = json.load(f)
              for pkg, info in data.items():
                lic = info.get("license") or info.get("licenses")
                if lic and lic not in allowed:
                  violations.append(f"{label}: {pkg} uses disallowed license: {lic}")
            except Exception as e:
              print(f"Warning: {fname}: {e}")
          if violations:
            print("LICENSE VIOLATIONS:")
            for v in violations:
              print(f"  - {v}")
            sys.exit(1)
          print("All licenses allowed")
        continue-on-error: true

  dependency-review:
    name: Dependency Review (PR Gate)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          config-file: '.github/dependency-review-config.yml'
          fail-on-severity: high
          allow-ghsas: []