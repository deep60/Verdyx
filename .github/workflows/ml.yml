name: ML CI

on:
  pull_request:
    paths:
      - 'ml/**'
      - '.github/workflows/ml.yml'
  push:
    branches: [main]
    paths:
      - 'ml/**'
      - '.github/workflows/ml.yml'

permissions:
  contents: read

jobs:
  test:
    name: Test ML service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./ml
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: ml/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q tests

  # Builds the image (no push) so a broken Dockerfile fails the PR, not main.
  image:
    name: Build ML service image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ./ml
          file: ./ml/Dockerfile
          push: false
          load: true
          tags: verdyx-ml-service:ci
          cache-from: type=gha,scope=ml-service-ci
          cache-to: type=gha,mode=max,scope=ml-service-ci
      - name: Service starts and reports a missing model
        run: |
          docker run -d --name ml -p 8090:8090 verdyx-ml-service:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8090/health > health.json; then break; fi
            sleep 1
          done
          cat health.json
          grep -q '"loaded": false' health.json
          docker logs ml
