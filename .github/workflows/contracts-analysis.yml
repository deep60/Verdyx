name: Contracts Static Analysis

on:
  push:
    branches: [ "main", "develop" ]
    paths:
      - 'blockchain/**'
      - '.github/workflows/contracts-analysis.yml'
  pull_request:
    branches: [ "main", "develop" ]
    paths:
      - 'blockchain/**'
      - '.github/workflows/contracts-analysis.yml'

jobs:
  slither:
    name: Slither (Static Analysis)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    defaults:
      run:
        working-directory: ./blockchain
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: blockchain/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Slither
        uses: crytic/slither-action@v0.4.2
        id: slither
        with:
          target: 'blockchain/'
          slither-config: 'blockchain/slither.config.json'
          sarif: results.sarif
          fail-on: medium

      - name: Upload Slither SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always() && steps.slither.outputs.sarif != ''
        with:
          sarif_file: ${{ steps.slither.outputs.sarif }}

  mythril:
    name: Mythril (Symbolic Execution)
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: read
      security-events: write
    defaults:
      run:
        working-directory: ./blockchain
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: blockchain/package-lock.json

      # The contracts import OpenZeppelin from node_modules (see mythril.solc.json).
      - name: Install dependencies
        run: npm ci

      - name: Install Mythril
        run: |
          pipx install mythril
          # Mythril still imports pkg_resources, which setuptools 81 removed.
          pipx inject mythril "setuptools<81"

      - name: Run Mythril on core contracts
        run: |
          # --execution-timeout doesn't bound solver time, so cap each contract.
          for contract in contracts/core/*.sol; do
            name=$(basename "$contract" .sol)
            echo "Analyzing $name..."
            status=0
            timeout 900 myth analyze "$contract:$name" --solc-json mythril.solc.json --solv 0.8.28 \
              --execution-timeout 120 --create-timeout 60 --solver-timeout 10000 --max-depth 50 \
              -o jsonv2 > "mythril-$name.json" || status=$?
            if [ "$status" -eq 124 ]; then
              echo "::warning::Mythril timed out on $name; its analysis is incomplete"
              echo '[{"issues": [], "timedOut": true}]' > "mythril-$name.json"
            fi
          done

      # Mythril exits non-zero for any finding, so judge the reports instead:
      # fail on High severity or an analysis that produced no report.
      - name: Check Mythril results
        run: |
          python3 - <<'PY'
          import glob, json, sys
          failed = False
          for path in sorted(glob.glob("mythril-*.json")):
              try:
                  reports = json.load(open(path))
              except ValueError:
                  print(f"{path}: Mythril produced no report")
                  failed = True
                  continue
              issues = [i for r in reports for i in r.get("issues", [])]
              for i in issues:
                  print(f"{path}: {i['severity']} {i['swcID']} {i['swcTitle']}")
              failed |= any(i["severity"] == "High" for i in issues)
              print(f"{path}: {len(issues)} issue(s)")
          sys.exit(1 if failed else 0)
          PY

      - name: Upload Mythril reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mythril-reports
          path: blockchain/mythril-*.json

  foundry-test:
    name: Foundry Tests (Fuzz + Invariant)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./blockchain
    steps:
      - uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Install dependencies
        run: forge install

      - name: Run unit tests
        run: forge test -vvv

      - name: Run fuzz tests (10000 runs)
        run: forge test --fuzz-runs 10000 -vv

      - name: Run invariant tests
        env:
          FOUNDRY_INVARIANT_RUNS: 1000
          FOUNDRY_INVARIANT_DEPTH: 50
        run: |
          if ! grep -rqE 'contract [A-Za-z0-9_]*Invariant' test 2>/dev/null; then
            echo "::warning::No invariant tests exist yet, so none were run."
            exit 0
          fi
          forge test --match-contract Invariant -vv

      - name: Run gas report
        run: forge test --gas-report
        continue-on-error: true

  foundry-coverage:
    name: Foundry Coverage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./blockchain
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Install dependencies
        run: forge install

      - name: Run coverage
        run: forge coverage --report lcov --ir-minimum

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./blockchain/lcov.info
          flags: contracts
          name: contracts-coverage

  solhint:
    name: Solhint (Linting)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./blockchain
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: blockchain/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Solhint
        run: npx solhint 'contracts/**/*.sol' --max-warnings 0

  prettier:
    name: Prettier (Formatting)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./blockchain
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: blockchain/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npx prettier --check 'contracts/**/*.sol'

  detect-secrets:
    name: Detect Secrets (TruffleHog)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./blockchain
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run TruffleHog
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          head: ${{ github.sha }}