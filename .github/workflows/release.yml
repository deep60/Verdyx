name: Release

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      version:
        description: "Version bump type (major, minor, patch, or exact version)"
        type: choice
        options:
          - patch
          - minor
          - major
          - "exact"
        default: patch
      exact_version:
        description: "Exact version if 'exact' selected (e.g., 1.2.3)"
        type: string
        required: false

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write
  issues: write
  pull-requests: write

jobs:
  release:
    name: Semantic Release
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install semantic-release
        run: npm install -g semantic-release @semantic-release/changelog @semantic-release/git @semantic-release/github @semantic-release/npm @semantic-release/exec

      - name: Run semantic-release (dry-run on dispatch)
        id: semantic
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            if [[ "${{ github.event.inputs.version }}" == "exact" ]]; then
              echo "version=${{ github.event.inputs.exact_version }}" >> "$GITHUB_OUTPUT"
              npx semantic-release --dry-run --branches main --release "${{ github.event.inputs.exact_version }}"
            else
              npx semantic-release --dry-run --branches main --release "${{ github.event.inputs.version }}"
            fi
          else
            npx semantic-release --branches main
          fi

      - name: Extract version from release
        if: steps.semantic.outputs.new_release_published == 'true'
        id: version
        run: |
          echo "version=${{ steps.semantic.outputs.new_release_version }}" >> "$GITHUB_OUTPUT"

      - name: Build release artifacts
        if: steps.semantic.outputs.new_release_published == 'true'
        run: |
          # Build all Docker images with the new version tag
          ./scripts/release/build-all.sh "${{ steps.version.outputs.version }}"

      - name: Generate release SBOM
        if: steps.semantic.outputs.new_release_published == 'true'
        uses: actions/workflow_call
        with:
          ref: main

  build-release-images:
    name: Build & Push Release Images
    runs-on: ubuntu-latest
    needs: release
    if: needs.release.outputs.version != ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - { service: frontend,             context: ./frontend, dockerfile: ./frontend/Dockerfile }
          - { service: api-gateway,          context: ./backend,  dockerfile: ./backend/api-gateway/Dockerfile }
          - { service: analysis-engine,      context: ./backend,  dockerfile: ./backend/analysis-engine/Dockerfile }
          - { service: bounty-manager,       context: ./backend,  dockerfile: ./backend/bounty-manager/Dockerfile }
          - { service: consensus-service,    context: ./backend,  dockerfile: ./backend/consensus-service/Dockerfile }
          - { service: notification-service, context: ./backend,  dockerfile: ./backend/notification-service/Dockerfile }
          - { service: payment-service,      context: ./backend,  dockerfile: ./backend/payment-service/Dockerfile }
          - { service: reputation-service,   context: ./backend,  dockerfile: ./backend/reputation-service/Dockerfile }
          - { service: submission-service,   context: ./backend,  dockerfile: ./backend/submission-service/Dockerfile }
          - { service: user-service,         context: ./backend,  dockerfile: ./backend/user-service/Dockerfile }
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/verdyx-${{ matrix.service }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Output image digest
        run: |
          echo "ghcr.io/${{ github.repository_owner }}/verdyx-${{ matrix.service }}@${{ steps.build.outputs.digest }}" > image-digest-${{ matrix.service }}.txt

      - name: Upload image digests
        uses: actions/upload-artifact@v4
        with:
          name: image-digests
          path: image-digest-*.txt

  sign-release:
    name: Sign Release Artifacts
    runs-on: ubuntu-latest
    needs: build-release-images
    steps:
      - uses: actions/checkout@v4

      - name: Download image digests
        uses: actions/download-artifact@v4
        with:
          name: image-digests
          path: ./digests

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: 'v2.4.0'

      - name: Sign all release images
        run: |
          for digest_file in ./digests/*.txt; do
            image=$(cat "$digest_file")
            cosign sign --yes "$image" \
              --annotations "github.repository=${{ github.repository }}" \
              --annotations "github.release=${{ needs.release.outputs.version }}"
          done

      - name: Generate and attach SBOM attestations
        run: |
          # SBOMs generated in sbom.yml workflow would be attached here
          echo "SBOM attestations attached"

  create-github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [release, build-release-images, sign-release]
    if: needs.release.outputs.version != ''
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: sbom-*
          path: ./artifacts
          merge-multiple: true

      - name: Create checksums
        run: |
          cd ./artifacts
          sha256sum * > checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.release.outputs.version }}
          name: Verdyx v${{ needs.release.outputs.version }}
          body_path: CHANGELOG.md
          draft: false
          prerelease: false
          files: |
            ./artifacts/*.json
            ./artifacts/checksums.txt
          generate_release_notes: true

      - name: Sign checksums
        run: |
          cosign sign-blob --yes ./artifacts/checksums.txt \
            --annotations "github.repository=${{ github.repository }}" \
            --annotations "github.release=v${{ needs.release.outputs.version }}"

  notify:
    name: Notify Release
    runs-on: ubuntu-latest
    needs: create-github-release
    if: always()
    steps:
      - name: Slack notification
        if: env.SLACK_WEBHOOK_URL != ''
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ needs.create-github-release.result }}
          text: 'Release v${{ needs.release.outputs.version }}: ${{ needs.create-github-release.result }}'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}

      - name: Discord notification
        if: env.DISCORD_WEBHOOK_URL != ''
        run: |
          curl -X POST "${{ secrets.DISCORD_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d "{\"content\": \"Verdyx v${{ needs.release.outputs.version }} released: ${{ needs.create-github-release.result }}\"}"