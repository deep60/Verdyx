name: Rust CI

on:
  push:
    branches: [ "main", "develop" ]
    paths:
      - 'backend/**'
      - '.github/workflows/rust.yml'
  pull_request:
    branches: [ "main", "develop" ]
    paths:
      - 'backend/**'
      - '.github/workflows/rust.yml'

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: "-D warnings"
  RUST_BACKTRACE: 1

jobs:
  check:
    name: Check (fmt, clippy, deny)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Cargo deny (licenses, bans, advisories)
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          args: --all-features

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: check
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      - name: Build workspace
        run: cargo build --workspace --all-targets --all-features --verbose

      - name: Build (release)
        run: cargo build --workspace --all-targets --all-features --release

  test:
    name: Test (unit + integration)
    runs-on: ubuntu-latest
    needs: build
    defaults:
      run:
        working-directory: ./backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: verdyx_test
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      - name: Install sqlx-cli
        uses: taiki-e/install-action@v2
        with:
          tool: sqlx-cli

      - name: Set up test databases (create + run migrations)
        working-directory: ${{ github.workspace }}
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: test_user
          PGPASSWORD: test_password
        run: |
          ./scripts/ci/setup-test-databases.sh
          cat "${{ github.workspace }}/.ci-test-db-env" >> "$GITHUB_ENV"

      - name: Run unit tests (nextest)
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - run: cargo nextest run --workspace --all-targets --all-features --profile ci
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/verdyx_test
          REDIS_URL: redis://localhost:6379
          RUST_LOG: debug

      - name: Run integration tests
        run: cargo nextest run --workspace --all-targets --all-features --profile ci --test integration
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/verdyx_test
          REDIS_URL: redis://localhost:6379

      - name: Run property-based tests (proptest)
        run: cargo nextest run --workspace --all-targets --all-features --profile ci --test proptest
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/verdyx_test
          REDIS_URL: redis://localhost:6379

  audit:
    name: Security Audit (cargo-audit)
    runs-on: ubuntu-latest
    needs: build
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Run cargo audit
        run: cargo audit --deny warnings
        # --deny warnings fails on unmaintained crates too; adjust if too noisy

      - name: Run cargo audit (json for SARIF)
        run: cargo audit --json > cargo-audit.json
        continue-on-error: true

      - name: Convert to SARIF
        if: always()
        run: |
          cargo install cargo-audit-sarif
          cargo audit-sarif cargo-audit.json cargo-audit.sarif
        continue-on-error: true

      - name: Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: ./backend/cargo-audit.sarif
          category: cargo-audit
        continue-on-error: true

  doc:
    name: Documentation Check
    runs-on: ubuntu-latest
    needs: build
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      - name: Check documentation builds
        run: cargo doc --workspace --all-features --no-deps --document-private-items

      - name: Check for broken intra-doc links
        run: cargo doc --workspace --all-features --no-deps 2>&1 | grep -q "broken" && exit 1 || true

  msrv:
    name: MSRV Check (1.78)
    runs-on: ubuntu-latest
    needs: build
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.120
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      - name: Build with MSRV
        run: cargo build --workspace --all-targets --all-features

      - name: Test with MSRV
        run: cargo nextest run --workspace --all-targets --all-features --profile ci
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/verdyx_test
          REDIS_URL: redis://localhost:6379

  coverage:
    name: Code Coverage (grcov)
    runs-on: ubuntu-latest
    needs: test
    defaults:
      run:
        working-directory: ./backend
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      - name: Install grcov
        uses: taiki-e/install-action@v2
        with:
          tool: grcov

      - name: Run tests with coverage
        env:
          CARGO_INCREMENTAL: 0
          RUSTFLAGS: "-Cinstrument-coverage -Ccodegen-units=1 -Copt-level=0 -Clink-dead-code -Coverflow-checks=off -Zpanic_abort_tests -Cpanic=abort"
          LLVM_PROFILE_FILE: "coverage/%p-%m.profraw"
        run: |
          cargo nextest run --workspace --all-targets --all-features --profile ci
          grcov . --binary-path ./target/debug/deps -s . -t lcov --branch --ignore-not-existing --ignore "/*" --ignore "*/.cargo/*" --ignore "*/tests/*" -o lcov.info

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./backend/lcov.info
          flags: backend
          name: backend-coverage