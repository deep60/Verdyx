name: Database backup

# Nightly check that the VM's database backups exist and restore.
# The pg-backup container on the VM uploads encrypted dumps to R2 at 20:30
# UTC (scripts/backup/vm-backup.sh); this downloads the newest set, restores
# every database into a scratch Postgres, fails if the set is stale, and
# applies retention (scripts/backup/verify-backup.sh). A failed run emails the
# repository owner (GitHub's default for scheduled workflows), which doubles
# as the alert.

on:
  schedule:
    - cron: "17 21 * * *" # 02:47 IST, 47 minutes after the VM uploads
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: db-backup
  cancel-in-progress: false

jobs:
  backup:
    name: Verify the newest backup
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      # Scratch server the dumps are restored into, to prove they work.
      restore:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: restore-check-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Check configuration
        id: cfg
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
          BUCKET: ${{ vars.BACKUP_S3_BUCKET }}
        run: |
          if [[ -z "$BACKUP_PASSPHRASE" || -z "$BUCKET" ]]; then
            echo "::warning::Backups aren't configured yet (see scripts/backup/verify-backup.sh); skipping."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install the Postgres 18 client (must be >= the server that made the dumps)
        if: steps.cfg.outputs.ok == 'true'
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-18
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"

      - name: Download, decrypt, restore, apply retention
        if: steps.cfg.outputs.ok == 'true'
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
          BACKUP_S3_BUCKET: ${{ vars.BACKUP_S3_BUCKET }}
          BACKUP_S3_ENDPOINT: ${{ vars.BACKUP_S3_ENDPOINT }}
          AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_S3_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          RESTORE_URL: postgres://postgres:restore-check-only@localhost:5432/postgres
        run: bash scripts/backup/verify-backup.sh
