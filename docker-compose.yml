services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: verdyx-postgres
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-verdyx_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-verdyx}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d
    networks:
      - verdyx-network
    # Restart on failure so a single OOM or crashed transaction does not take
    # the whole stack down — every backend service depends_on this.
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-verdyx_user} -d ${POSTGRES_DB:-verdyx}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: verdyx-redis
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    env_file:
      - .env
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - verdyx-network
    # Restart on failure — same rationale as postgres above.
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "--no-auth-warning", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # API Gateway Service
  api-gateway:
    image: ghcr.io/deep60/verdyx-api-gateway:latest
    build:
      context: ./backend
      dockerfile: ./api-gateway/Dockerfile
    container_name: verdyx-api-gateway
    env_file:
      - .env
    ports:
      - "8080:8080"
    environment:
      - RUST_LOG=info
      - DATABASE_URL=postgresql://${POSTGRES_USER:-verdyx_user}:${POSTGRES_PASSWORD}@${POSTGRES_HOST:-postgres}:${POSTGRES_PORT:-5432}/verdyx_gateway
      - REDIS_URL=redis://:${REDIS_PASSWORD}@${REDIS_HOST:-redis}:6379
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=8080
      - JWT_SECRET=${JWT_SECRET}
      # Downstream service URLs (container name + internal port 8080)
      - USER_SERVICE_URL=http://user-service:8080
      - ANALYSIS_ENGINE_URL=http://analysis-engine:8080
      - BOUNTY_MANAGER_URL=http://bounty-manager:8080
      - SUBMISSION_SERVICE_URL=http://submission-service:8080
      - STORAGE_SERVICE_URL=http://submission-service:8080
      - CONSENSUS_SERVICE_URL=http://consensus-service:8080
      - PAYMENT_SERVICE_URL=http://payment-service:8080
      - REPUTATION_SERVICE_URL=http://reputation-service:8080
      - NOTIFICATION_SERVICE_URL=http://notification-service:8080
      # CORS: allow the frontend origins
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:5001}
      # Blockchain Configuration
      - BLOCKCHAIN_RPC_URL=${BLOCKCHAIN_RPC_URL}
      - THREAT_TOKEN_ADDRESS=${THREAT_TOKEN_ADDRESS}
      - REPUTATION_SYSTEM_ADDRESS=${REPUTATION_SYSTEM_ADDRESS}
      - BOUNTY_MANAGER_ADDRESS=${BOUNTY_MANAGER_ADDRESS}
      - CHAIN_ID=${CHAIN_ID:-31337}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - verdyx-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
  user-service:
    image: ghcr.io/deep60/verdyx-user-service:latest
    build:
      context: ./backend
      dockerfile: ./user-service/Dockerfile
    container_name: verdyx-user-service
    env_file:
      - .env
    ports:
      - "8081:8080"
    environment:
      - RUST_LOG=info
      - DATABASE_URL=postgresql://${POSTGRES_USER:-verdyx_user}:${POSTGRES_PASSWORD}@${POSTGRES_HOST:-postgres}:${POSTGRES_PORT:-5432}/verdyx_users
      - REDIS_URL=redis://:${REDIS_PASSWORD}@${REDIS_HOST:-redis}:6379
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=8080
      - JWT_SECRET=${JWT_SECRET}
      # S3/MinIO Configuration for avatar uploads
      - S3_ENDPOINT=http://minio:9000
      - S3_REGION=us-east-1
      - S3_AVATAR_BUCKET=verdyx-avatars
      - S3_ACCESS_KEY=${MINIO_ROOT_USER:-verdyx_admin}
      - S3_SECRET_KEY=${MINIO_ROOT_PASSWORD}
      # Blockchain Configuration
      - BLOCKCHAIN_RPC_URL=${BLOCKCHAIN_RPC_URL}
      - THREAT_TOKEN_ADDRESS=${THREAT_TOKEN_ADDRESS}
      - REPUTATION_SYSTEM_ADDRESS=${REPUTATION_SYSTEM_ADDRESS}
      - BOUNTY_MANAGER_ADDRESS=${BOUNTY_MANAGER_ADDRESS}
      - CHAIN_ID=${CHAIN_ID:-31337}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - verdyx-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # MinIO (S3-compatible object storage)
  minio:
    image: minio/minio:latest
    container_name: verdyx-minio
    command: server /data --console-address ":9001"
    env_file:
      - .env
    ports:
      - "9000:9000"  # API
      - "9001:9001"  # Console
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-verdyx_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    networks:
      - verdyx-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ClamAV Antivirus Scanner
  clamav:
    image: clamav/clamav-debian:latest
    container_name: verdyx-clamav
    ports:
      - "3310:3310"
    volumes:
      - clamav_data:/var/lib/clamav
    networks:
      - verdyx-network
    healthcheck:
      test: ["CMD", "/usr/local/bin/clamdcheck.sh"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 300s
    restart: unless-stopped

  # Analysis Engine Service
  analysis-engine:
    image: ghcr.io/deep60/verdyx-analysis-engine:latest
    build:
      context: ./backend
      dockerfile: ./analysis-engine/Dockerfile
    container_name: verdyx-analysis-engine
    env_file:
      - .env
    ports:
      - "8082:8080"
    environment:
      - RUST_LOG=info
      - DATABASE_URL=postgresql://${POSTGRES_USER:-verdyx_user}:${POSTGRES_PASSWORD}@${POSTGRES_HOST:-postgres}:${POSTGRES_PORT:-5432}/verdyx_analysis
      - REDIS_URL=redis://:${REDIS_PASSWORD}@${REDIS_HOST:-redis}:6379
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=8080
      # S3/MinIO Configuration for file storage
      - S3_ENDPOINT=http://minio:9000
      - S3_REGION=us-east-1
      - S3_BUCKET=verdyx-submissions
      - S3_ACCESS_KEY=${MINIO_ROOT_USER:-verdyx_admin}
      - S3_SECRET_KEY=${MINIO_ROOT_PASSWORD}
      # YARA rules configuration
      - YARA_RULES_PATH=/app/rules
      # ClamAV configuration
      - CLAMAV_HOST=clamav:3310
      - ENABLE_CLAMAV=true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      clamav:
        condition: service_started
    networks:
      - verdyx-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Bounty Manager Service
  bounty-manager:
    image: ghcr.io/deep60/verdyx-bounty-manager:latest
    build:
      context: ./backend
      dockerfile: ./bounty-manager/Dockerfile
    container_name: verdyx-bounty-manager
    env_file:
      - .env
    ports:
      - "8083:8080"
    environment:
      - RUST_LOG=info
      - DATABASE_URL=postgresql://${POSTGRES_USER:-verdyx_user}:${POSTGRES_PASSWORD}@${POSTGRES_HOST:-postgres}:${POSTGRES_PORT:-5432}/verdyx_bounty
      - REDIS_URL=redis://:${REDIS_PASSWORD}@${REDIS_HOST:-redis}:6379
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=8080
      # Blockchain Configuration
      - BLOCKCHAIN_RPC_URL=${BLOCKCHAIN_RPC_URL}
      - THREAT_TOKEN_ADDRESS=${THREAT_TOKEN_ADDRESS}
      - REPUTATION_SYSTEM_ADDRESS=${REPUTATION_SYSTEM_ADDRESS}
      - BOUNTY_MANAGER_ADDRESS=${BOUNTY_MANAGER_ADDRESS}
      - CHAIN_ID=${CHAIN_ID:-31337}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - verdyx-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Submission Service
  submission-service:
    image: ghcr.io/deep60/verdyx-submission-service:latest
    build:
      context: ./backend
      dockerfile: ./submission-service/Dockerfile
    container_name: verdyx-submission-service
    env_file:
      - .env
    ports:
      - "8084:8080"
    environment:
      - RUST_LOG=info
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=8080
      - SUBMISSION_SERVICE_PORT=8080
      # Database and Redis Configuration
      - DATABASE_URL=postgresql://${POSTGRES_USER:-verdyx_user}:${POSTGRES_PASSWORD}@${POSTGRES_HOST:-postgres}:${POSTGRES_PORT:-5432}/verdyx_submissions
      - REDIS_URL=redis://:${REDIS_PASSWORD}@${REDIS_HOST:-redis}:6379
      # S3/MinIO Configuration
      - S3_ENDPOINT=http://minio:9000
      - S3_REGION=us-east-1
      - S3_BUCKET=verdyx-submissions
      - S3_ACCESS_KEY=${MINIO_ROOT_USER:-verdyx_admin}
      - S3_SECRET_KEY=${MINIO_ROOT_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - verdyx-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # Consensus Service
  consensus-service:
    image: ghcr.io/deep60/verdyx-consensus-service:latest
    build:
      context: ./backend
      dockerfile: ./consensus-service/Dockerfile
    container_name: verdyx-consensus-service
    env_file:
      - .env
    ports:
      - "8085:8080"
    environment:
      - RUST_LOG=info
      - DATABASE_URL=postgresql://${POSTGRES_USER:-verdyx_user}:${POSTGRES_PASSWORD}@${POSTGRES_HOST:-postgres}:${POSTGRES_PORT:-5432}/verdyx_consensus
      - REDIS_URL=redis://:${REDIS_PASSWORD}@${REDIS_HOST:-redis}:6379
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=8080
      # Consensus algorithm configuration
      - CONSENSUS_THRESHOLD=0.7
      - MIN_SUBMISSIONS_REQUIRED=3
      # Delayed re-grading: re-check finalized verdicts once the world knows
      # more, so held-back payouts settle against the graded verdict rather
      # than the original vote. Off by default -- it moves money.
      - GRADING_ENABLED=${GRADING_ENABLED:-false}
      - GRADING_DELAY_HOURS=${GRADING_DELAY_HOURS:-720}
      - GRADING_POLL_INTERVAL_SECS=${GRADING_POLL_INTERVAL_SECS:-3600}
      - GRADING_BATCH_SIZE=${GRADING_BATCH_SIZE:-50}
      - GRADING_RESCAN_TIMEOUT_SECS=${GRADING_RESCAN_TIMEOUT_SECS:-120}
      - ANALYSIS_ENGINE_URL=http://analysis-engine:8080
      # Commit-reveal voting: hide votes until the window shuts so a late voter
      # cannot read the tally and copy whoever is ahead. Off by default -- it
      # changes the voting API. Enabling it CLOSES the direct vote endpoint.
      - COMMIT_REVEAL_ENABLED=${COMMIT_REVEAL_ENABLED:-false}
      - COMMIT_WINDOW_HOURS=${COMMIT_WINDOW_HOURS:-24}
      - REVEAL_WINDOW_HOURS=${REVEAL_WINDOW_HOURS:-24}
      - MIN_SALT_LEN=${MIN_SALT_LEN:-16}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - verdyx-network
    restart: unless-stopped

  # Payment Service
  payment-service:
    image: ghcr.io/deep60/verdyx-payment-service:latest
    build:
      context: ./backend
      dockerfile: ./payment-service/Dockerfile
    container_name: verdyx-payment-service
    env_file:
      - .env
    ports:
      - "8086:8080"
    environment:
      - RUST_LOG=info
      - DATABASE_URL=postgresql://${POSTGRES_USER:-verdyx_user}:${POSTGRES_PASSWORD}@${POSTGRES_HOST:-postgres}:${POSTGRES_PORT:-5432}/verdyx_payments
      - REDIS_URL=redis://:${REDIS_PASSWORD}@${REDIS_HOST:-redis}:6379
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=8080
      # Blockchain Configuration
      - BLOCKCHAIN_RPC_URL=${BLOCKCHAIN_RPC_URL}
      - BLOCKCHAIN_CHAIN_ID=${CHAIN_ID:-31337}
      - TREASURY_ADDRESS=${TREASURY_ADDRESS}
      - TREASURY_PRIVATE_KEY=${TREASURY_PRIVATE_KEY}
      - TOKEN_CONTRACT_ADDRESS=${THREAT_TOKEN_ADDRESS}
      - PAYMENT_CONTRACT_ADDRESS=${BOUNTY_MANAGER_ADDRESS}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - verdyx-network
    restart: unless-stopped

  # Reputation Service
  reputation-service:
    image: ghcr.io/deep60/verdyx-reputation-service:latest
    build:
      context: ./backend
      dockerfile: ./reputation-service/Dockerfile
    container_name: verdyx-reputation-service
    env_file:
      - .env
    ports:
      - "8087:8080"
    environment:
      - RUST_LOG=info
      - DATABASE_URL=postgresql://${POSTGRES_USER:-verdyx_user}:${POSTGRES_PASSWORD}@${POSTGRES_HOST:-postgres}:${POSTGRES_PORT:-5432}/verdyx_reputation
      - REDIS_URL=redis://:${REDIS_PASSWORD}@${REDIS_HOST:-redis}:6379
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=8080
      # Reputation calculation parameters
      - REPUTATION_DECAY_RATE=0.95
      - REPUTATION_UPDATE_INTERVAL=3600
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - verdyx-network
    restart: unless-stopped

  # Notification Service
  notification-service:
    image: ghcr.io/deep60/verdyx-notification-service:latest
    build:
      context: ./backend
      dockerfile: ./notification-service/Dockerfile
    container_name: verdyx-notification-service
    env_file:
      - .env
    ports:
      - "8088:8080"
    environment:
      - RUST_LOG=info
      - DATABASE_URL=postgresql://${POSTGRES_USER:-verdyx_user}:${POSTGRES_PASSWORD}@${POSTGRES_HOST:-postgres}:${POSTGRES_PORT:-5432}/verdyx_notifications
      - REDIS_URL=redis://:${REDIS_PASSWORD}@${REDIS_HOST:-redis}:6379
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=8080
      # Email Configuration
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USERNAME=${SMTP_USERNAME}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - EMAIL_FROM=${EMAIL_FROM}
      # Webhook Configuration
      - WEBHOOK_TIMEOUT=30
      - MAX_RETRY_ATTEMPTS=3
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - verdyx-network
    restart: unless-stopped

  # Frontend Web Application
  frontend:
    image: ghcr.io/deep60/verdyx-frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: verdyx-frontend
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 5000
      # The BFF only reverse-proxies /api/* to the gateway and serves static
      # assets. It owns no database, cache, or auth state, so no DATABASE_URL /
      # REDIS_URL / JWT_SECRET / BCRYPT are needed here.
      API_URL: ${API_URL:-http://localhost:8080}
      # The BFF proxies /api/* to the gateway by container name on the network.
      API_GATEWAY_URL: http://api-gateway:8080
    ports:
      - "5001:5000"
    depends_on:
      # Wait for api-gateway to pass its healthcheck before the BFF accepts
      # traffic, otherwise the first wave of frontend requests races the
      # gateway start_period and 502s.
      api-gateway:
        condition: service_healthy
    networks:
      - verdyx-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5000/', (r) => {process.exit(r.statusCode < 500 ? 0 : 1)}).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # PgAdmin (DEV ONLY - gated behind the `dev-tools` profile so a stock
  # `docker compose up` does not start it. Bring it up explicitly with:
  #   docker compose --profile dev-tools up -d pgadmin
  # `.env.production` is explicit that pgAdmin must NOT be deployed to prod.)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: verdyx-pgadmin
    profiles: ["dev-tools"]
    env_file:
      - .env
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@verdyx.io}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-CHANGE_ME}
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - verdyx-network
    restart: unless-stopped

  # ── Edge TLS reverse proxy (profile: edge) ─────────────────────────────────
  # Terminates HTTPS with automatic Let's Encrypt certs and proxies to the
  # frontend BFF (which serves the SPA and proxies /api/* to the gateway).
  # Opt-in so it never races a host-level nginx already bound to :80/:443 —
  # bring it up only when cutting over:
  #   docker compose --profile edge up -d caddy
  # See infrastructure/caddy/Caddyfile.
  caddy:
    image: caddy:2.9-alpine
    container_name: verdyx-caddy
    profiles: ["edge"]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"   # HTTP/3
    environment:
      DOMAIN: ${DOMAIN:-verdyx.duckdns.org}
      ACME_EMAIL: ${ACME_EMAIL:-admin@verdyx.io}
    volumes:
      - ./infrastructure/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend:
        condition: service_healthy
    networks:
      - verdyx-network

  # ── Auto-deploy ────────────────────────────────────────────────────────────
  # Watches GHCR for new :latest images and restarts the affected app
  # containers. Pull-based / outbound-only — needs no inbound access, GitHub
  # secrets, or security-group changes. Only the app services named below are
  # monitored; stateful infra (postgres/redis/minio/clamav/pgadmin) is
  # deliberately excluded so it never auto-updates.
  watchtower:
    image: containrrr/watchtower:latest
    container_name: verdyx-watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      # containrrr/watchtower:latest ships an old Docker API client; pin the
      # negotiated version so the modern host daemon (min API 1.40) accepts it.
      DOCKER_API_VERSION: "1.40"
      WATCHTOWER_CLEANUP: "true"            # prune the old image after each update
      WATCHTOWER_POLL_INTERVAL: "300"       # check GHCR every 5 minutes
      WATCHTOWER_ROLLING_RESTART: "true"    # update one container at a time
      WATCHTOWER_INCLUDE_RESTARTING: "true"
      WATCHTOWER_NO_STARTUP_MESSAGE: "true"
    command: >-
      verdyx-frontend
      verdyx-api-gateway
      verdyx-user-service
      verdyx-analysis-engine
      verdyx-bounty-manager
      verdyx-submission-service
      verdyx-consensus-service
      verdyx-payment-service
      verdyx-reputation-service
      verdyx-notification-service

  # ── Observability (profile: monitoring) ─────────────────────────────────────
  # Scrapes every service's /metrics and evaluates alert rules. Host port is
  # bound to 127.0.0.1 only — reach it via SSH tunnel, never exposed publicly.
  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: verdyx-prometheus
    profiles: ["monitoring"]
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    networks:
      - verdyx-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # Receives fired alerts from Prometheus and delivers them (Slack/email) with
  # grouping, dedup, and silencing. 127.0.0.1-only like the rest of the
  # observability stack; the Slack webhook is read from a gitignored secret
  # file (see monitoring/alertmanager/alertmanager.yml).
  alertmanager:
    image: prom/alertmanager:v0.28.0
    container_name: verdyx-alertmanager
    profiles: ["monitoring"]
    restart: unless-stopped
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ./monitoring/alertmanager/secrets:/etc/alertmanager/secrets:ro
      - alertmanager_data:/alertmanager
    ports:
      - "127.0.0.1:9093:9093"
    networks:
      - verdyx-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9093/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Dashboards over Prometheus. Also 127.0.0.1-only; view via SSH tunnel
  # (ssh -L 3001:localhost:3001 ...) or put it behind nginx + auth later.
  grafana:
    image: grafana/grafana:11.4.0
    container_name: verdyx-grafana
    profiles: ["monitoring"]
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-verdyx_admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:3001:3000"
    networks:
      - verdyx-network

  # ── Backups (profile: backup) ───────────────────────────────────────────────
  # Nightly pg_dumpall of the whole cluster, gzipped, with local retention.
  db-backup:
    image: postgres:16-alpine
    container_name: verdyx-db-backup
    profiles: ["backup"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_USER: ${POSTGRES_USER:-verdyx_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-7}
      # Off-site upload (optional): set BACKUP_S3_BUCKET to also push each
      # verified dump to S3/MinIO. Reuses the stack's AWS_* / MinIO creds.
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
      BACKUP_S3_PREFIX: ${BACKUP_S3_PREFIX:-pg}
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-${AWS_ENDPOINT_URL:-}}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_REGION: ${AWS_REGION:-us-east-1}
    volumes:
      - ./scripts/backup/pg-backup.sh:/usr/local/bin/pg-backup.sh:ro
      - pg_backups:/backups
    entrypoint: ["/bin/sh", "/usr/local/bin/pg-backup.sh"]
    networks:
      - verdyx-network

networks:
  verdyx-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  minio_data:
  clamav_data:
  prometheus_data:
  alertmanager_data:
  grafana_data:
  pg_backups:
  caddy_data:
  caddy_config:
